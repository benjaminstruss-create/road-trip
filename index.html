<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Struss Family Road Trip 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── CONFIGURATION ────────────────────────────────────────────────────────
  const supabaseUrl = 'https://ppnsknbcavcaswelhfac.supabase.co';
  const supabaseKey = 'sb_publishable_GMRYvSKaYhpNFoDhS4YANw_t3vE27Qe';
  
  // FIXED: Renamed to supabaseClient to avoid the name clash
  const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  // ── DATABASE SYNC ────────────────────────────────────────────────────────
  async function saveState() {
    localStorage.setItem('tripS', JSON.stringify(S));
    const { error } = await supabaseClient
      .from('trip_data')
      .upsert({ id: 1, category: 'full_state', content: S });

    if (error) {
      console.error('Cloud Sync Error:', error.message);
      setSyncStatus('error');
    } else {
      setSyncStatus('synced');
    }
  }

  async function loadState() {
    const { data, error } = await supabaseClient
      .from('trip_data')
      .select('content')
      .eq('id', 1)
      .single();

    if (data && data.content) {
      S = { ...S, ...data.content };
      setSyncStatus('synced');
      if (typeof renderTab === 'function') renderTab(_currentTab);
    } else if (localStorage.getItem('tripS')) {
      S = JSON.parse(localStorage.getItem('tripS'));
      setSyncStatus('local only');
    }
  }

  // ── PHOTO STORAGE ────────────────────────────────────────────────────────
  async function uploadPhotoToSupabase(fileData, fileName) {
    const base64Data = fileData.split(',')[1];
    const byteCharacters = atob(base64Data);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: 'image/jpeg'});

    const filePath = `public/${Date.now()}-${fileName}.jpg`;

    const { data, error } = await supabaseClient.storage
      .from('trip-photos')
      .upload(filePath, blob);

    if (error) {
      console.error('Upload Error:', error.message);
      return null;
    }

    const { data: urlData } = supabaseClient.storage.from('trip-photos').getPublicUrl(filePath);
    return urlData.publicUrl;
  }
</script>

<style>
/* CSS Reset and Variables */
:root {
  --pine: #0f1f0f; --forest: #1e3a1e; --moss: #3d6b4a; --sage: #6a9e7a; --mist: #b0ceba;
  --cream: #f4efe6; --sand: #e6dcc8; --sandDark: #d8cdb8; --amber: #c07828;
  --amberLight: #e8a04a; --sky: #4a7fa0; --card: rgba(255,255,255,0.94);
  --shadow: 0 2px 16px rgba(15,31,15,0.10); --shadowHover: 0 6px 28px rgba(15,31,15,0.18);
  --radius: 16px; --text: #1a1a18; --textMid: #4a4a46; --textLight: #7a7a74; --border: rgba(0,0,0,0.07);
}
[data-dark] {
  --cream: #0c160c; --sand: #142014; --sandDark: #1c2e1c; --card: rgba(20,38,20,0.97);
  --shadow: 0 2px 16px rgba(0,0,0,0.35); --text: #e4ede4; --textMid: #9ab89a;
  --textLight: #6a8a6a; --border: rgba(255,255,255,0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }

/* PIN Screen */
#pinScreen { position: fixed; inset: 0; z-index: 999; background: var(--pine); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.75rem; padding: 2rem; }
.pinTitle { font-family: 'Playfair Display', serif; color: var(--mist); font-size: clamp(1.6rem,5vw,2.4rem); text-align: center; line-height: 1.2; }
.pinSub { color: var(--sage); font-size: .8rem; }
.pinDots { display: flex; gap: .9rem; }
.pinDot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sage); transition: all .2s; }
.pinDot.on { background: var(--amber); border-color: var(--amber); transform: scale(1.15); }
.pinPad { display: grid; grid-template-columns: repeat(3,1fr); gap: .65rem; max-width: 240px; width: 100%; }
.pinKey { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: var(--mist); font-family: 'DM Sans',sans-serif; font-size: 1.4rem; font-weight: 500; padding: .9rem; border-radius: 12px; cursor: pointer; transition: all .12s; user-select: none; }
.pinKey:active { background: rgba(200,120,40,.35); transform: scale(.94); }
.pinErr { color: #e08080; font-size: .8rem; min-height: 1.2em; }

/* App Layout */
#app { display: none; flex-direction: column; height: 100vh; }
#app.visible { display: flex; }

header { background: var(--pine); padding: .9rem 1rem 0; position: sticky; top: 0; z-index: 100; }
.hTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
.hTitle h1 { font-family: 'Playfair Display',serif; font-size: 1.15rem; color: var(--mist); line-height: 1; }
.hTitle p { font-size: .7rem; color: var(--sage); margin-top: 2px; }
.syncStatus { font-size: .62rem; color: var(--sage); margin-top: 2px; display: flex; align-items: center; gap: .3rem; }
.syncDot { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }

nav { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid rgba(255,255,255,.06); }
.tab { flex-shrink: 0; padding: .55rem .8rem; font-size: .68rem; font-weight: 600; text-transform: uppercase; color: var(--sage); border: none; background: transparent; cursor: pointer; transition: all .2s; }
.tab.on { color: var(--mist); border-bottom: 2px solid var(--amber); }

main { flex: 1; overflow-y: auto; padding: 1.1rem; max-width: 640px; margin: 0 auto; width: 100%; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="pinScreen">
  <div style="text-align:center">
    <div style="font-size:3rem;margin-bottom:.5rem">🏔️</div>
    <div class="pinTitle">Struss Family<br>Road Trip 2026</div>
    <div class="pinSub" style="margin-top:.4rem">Jun 27 – Jul 27</div>
  </div>
  <div class="pinDots" id="pinDots">
    <div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div>
  </div>
  <div class="pinPad">
    <button class="pinKey" onclick="pin('1')">1</button><button class="pinKey" onclick="pin('2')">2</button><button class="pinKey" onclick="pin('3')">3</button>
    <button class="pinKey" onclick="pin('4')">4</button><button class="pinKey" onclick="pin('5')">5</button><button class="pinKey" onclick="pin('6')">6</button>
    <button class="pinKey" onclick="pin('7')">7</button><button class="pinKey" onclick="pin('8')">8</button><button class="pinKey" onclick="pin('9')">9</button>
    <button class="pinKey" onclick="pin('clr')" style="font-size:.8rem">CLR</button><button class="pinKey" onclick="pin('0')">0</button><button class="pinKey" onclick="pin('back')">⌫</button>
  </div>
  <div class="pinErr" id="pinErr">&nbsp;</div>
</div>

<div id="app">
  <header>
    <div class="hTop">
      <div class="hTitle">
        <h1>Struss Road Trip</h1>
        <div style="display:flex;align-items:center;gap:.5rem">
          <p>Jun 27 – Jul 27, 2026</p>
          <div class="syncStatus" id="syncStatus"><div class="syncDot"></div><span>local</span></div>
        </div>
      </div>
    </div>
    <nav>
      <button class="tab on" onclick="goTab('home')">Home</button>
      <button class="tab" onclick="goTab('itinerary')">Itinerary</button>
      <button class="tab" onclick="goTab('budget')">Budget</button>
      <button class="tab" onclick="goTab('activities')">Activities</button>
      <button class="tab" onclick="goTab('hunt')">🔍 Hunt</button>
      <button class="tab" onclick="goTab('journal')">Journal</button>
    </nav>
  </header>
  <main>
    <div id="tHome"><h2>Welcome Home</h2><p>Your road trip data is syncing...</p></div>
    <div id="tItinerary" class="hidden"></div>
    <div id="tBudget" class="hidden"></div>
    <div id="tActivities" class="hidden"></div>
    <div id="tHunt" class="hidden"></div>
    <div id="tJournal" class="hidden"></div>
  </main>
</div>

<script>
let S = { expenses: [], activities: {}, hunt: {}, journal: [], theme: 'light' };
let _currentTab = 'home';
const PIN = '2829';
let _pinBuf = '';

function pin(v) {
  if (v==='clr') _pinBuf='';
  else if (v==='back') _pinBuf=_pinBuf.slice(0,-1);
  else if (_pinBuf.length<4) _pinBuf+=v;
  
  document.querySelectorAll('.pinDot').forEach((d,i)=>d.classList.toggle('on',i<_pinBuf.length));
  
  if (_pinBuf.length===4) {
    if (_pinBuf===PIN) {
      unlock();
    } else {
      _pinBuf='';
      document.getElementById('pinErr').textContent='Wrong PIN';
      setTimeout(() => { document.getElementById('pinErr').textContent=' '; }, 2000);
    }
  }
}

async function unlock() {
  // FIXED: No longer crashes because loadState is now correctly loaded
  await loadState();
  document.getElementById('pinScreen').style.display='none';
  document.getElementById('app').classList.add('visible');
}

function goTab(t) {
    _currentTab = t;
    ['home','itinerary','budget','activities','hunt','journal'].forEach(x => {
        const el = document.getElementById('t' + x.charAt(0).toUpperCase() + x.slice(1));
        if (el) el.classList.toggle('hidden', x !== t);
    });
    document.querySelectorAll('.tab').forEach(el => {
      el.classList.toggle('on', el.textContent.toLowerCase().includes(t));
    });
}

function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.querySelector('span').textContent = msg;
}
</script>
</body>
</html>
