<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ── SUPABASE CONNECTION ───────────────────────────────────────────────────
  // Variable is named "roadTripDb" to avoid clashing with the global "supabase"
  // object that the CDN library creates automatically.
  const SUPABASE_URL  = 'https://ppnsknbcavcaswelhfac.supabase.co';
  const SUPABASE_KEY  = 'sb_publishable_GMRYvSKaYhpNFoDhS4YANw_t3vE27Qe';
  const STORAGE_BUCKET = 'trip-photos';
  const SYNC_ROW_ID   = 1;

  let roadTripDb;
  try {
    // supabase (the CDN global) exposes createClient
    roadTripDb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.__supabaseReady = true;
    console.log('Supabase connected');

    // Real-time listener: push remote changes to all open tabs
    roadTripDb
      .channel('trip_data_changes')
      .on('postgres_changes', {
        event: 'UPDATE',
        schema: 'public',
        table: 'trip_data',
        filter: `id=eq.${SYNC_ROW_ID}`
      }, (payload) => {
        const remote = payload.new?.content;
        if (remote) {
          window.__remoteState = remote;
          if (window.__appReady) mergeRemoteState(remote);
        }
      })
      .subscribe();
  } catch(e) {
    console.warn('Supabase not available, falling back to localStorage:', e.message);
    window.__supabaseReady = false;
  }
  // ─────────────────────────────────────────────────────────────────────────
</script>

<style>
:root {
  --pine: #0f1f0f;
  --forest: #1e3a1e;
  --moss: #3d6b4a;
  --sage: #6a9e7a;
  --mist: #b0ceba;
  --cream: #f4efe6;
  --sand: #e6dcc8;
  --sandDark: #d8cdb8;
  --amber: #c07828;
  --amberLight: #e8a04a;
  --sky: #4a7fa0;
  --card: rgba(255,255,255,0.94);
  --shadow: 0 2px 16px rgba(15,31,15,0.10);
  --shadowHover: 0 6px 28px rgba(15,31,15,0.18);
  --radius: 16px;

}

  --textLight: #6a8a6a;
  --border: rgba(255,255,255,0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }

/* ── PIN ── */
#pinScreen {
  position: fixed; inset: 0; z-index: 999;
  background: var(--pine);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1.75rem;
  padding: 2rem;
}
.pinTitle { font-family: 'Playfair Display', serif; color: var(--mist); font-size: clamp(1.6rem,5vw,2.4rem); text-align: center; line-height: 1.2; }
.pinSub { color: var(--sage); font-size: .8rem; }
.pinDots { display: flex; gap: .9rem; }
.pinDot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--sage); transition: all .2s; }
.pinDot.on { background: var(--amber); border-color: var(--amber); transform: scale(1.15); }
.pinPad { display: grid; grid-template-columns: repeat(3,1fr); gap: .65rem; max-width: 240px; width: 100%; }
.pinKey { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); color: var(--mist); font-family: 'DM Sans',sans-serif; font-size: 1.4rem; font-weight: 500; padding: .9rem; border-radius: 12px; cursor: pointer; transition: all .12s; user-select: none; }
.pinKey:active { background: rgba(200,120,40,.35); transform: scale(.94); }
.pinErr { color: #e08080; font-size: .8rem; min-height: 1.2em; }

/* ── LAYOUT ── */
#app { display: none; flex-direction: column; height: 100vh; }
#app.visible { display: flex; }

/* ── HEADER ── */
header { background: var(--pine); padding: .9rem 1rem 0; position: sticky; top: 0; z-index: 100; }
.hTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: .7rem; }
.hTitle h1 { font-family: 'Playfair Display',serif; font-size: 1.15rem; color: var(--mist); line-height: 1; }
.hTitle p { font-size: .7rem; color: var(--sage); margin-top: 2px; }
.hActions { display: flex; gap: .4rem; }
.iconBtn { background: rgba(255,255,255,.09); border: none; color: var(--mist); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: .95rem; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.iconBtn:active { background: rgba(255,255,255,.2); }

/* ── TABS ── */
nav { display: flex; overflow-x: auto; scrollbar-width: none; border-top: 1px solid rgba(255,255,255,.06); }
nav::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: .55rem .8rem; font-size: .68rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--sage); border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; }
.tab.on { color: var(--mist); border-bottom-color: var(--amber); }

/* ── MAIN ── */
main { flex: 1; overflow-y: auto; padding: 1.1rem; max-width: 640px; margin: 0 auto; width: 100%; }

/* ── CARDS ── */
.card { background: var(--card); border-radius: var(--radius); padding: 1.15rem; margin-bottom: .85rem; box-shadow: var(--shadow); }

.sectionLabel { font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--textLight); margin: 1rem 0 .6rem; }

/* ── TODAY BANNER ── */
.todayBanner { background: linear-gradient(135deg, var(--forest), var(--moss)); border-radius: var(--radius); padding: 1.15rem; margin-bottom: .85rem; color: white; box-shadow: var(--shadow); }
.todayLabel { font-size: .65rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.todayLoc { font-family: 'Playfair Display',serif; font-size: 1.55rem; margin: .2rem 0; }
.todayPark { font-size: .8rem; opacity: .85; }
.todayDay { font-size: .72rem; opacity: .65; margin-top: .2rem; }

/* ── STOPS ── */
.stopCard { background: var(--card); border-radius: var(--radius); padding: .95rem 1.1rem; margin-bottom: .7rem; box-shadow: var(--shadow); border-left: 4px solid var(--moss); cursor: pointer; transition: transform .12s, box-shadow .12s; }

.badge { background: var(--amber); color: white; font-size: .6rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: .05em; }

/* ── ACTIVITIES ── */
.actItem { display: flex; align-items: flex-start; gap: .65rem; padding: .65rem 0; border-bottom: 1px solid var(--border); }

.actCheck { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--moss); background: transparent; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .7rem; transition: all .18s; margin-top: 1px; color: white; }

.actBody { flex: 1; cursor: pointer; }
.actName { font-size: .875rem; line-height: 1.3; }

.tag.must { background: #fde8cc; color: #8a5010; }
.tag.hike { background: #d4ead6; color: #1e4a24; }
.tag.food { background: #fdddd8; color: #8a2a1a; }
.tag.view { background: #d8e8f8; color: #1a3a6a; }

[data-dark] .tag.hike { background: #103020; color: #60c880; }
[data-dark] .tag.food { background: #501818; color: #e88070; }
[data-dark] .tag.view { background: #102040; color: #60a0e0; }
[data-dark] .tag.water { background: #102840; color: #60b8e0; }
.actDel { background: none; border: none; color: var(--textLight); cursor: pointer; font-size: .85rem; padding: .2rem; flex-shrink: 0; }

/* ── SWIPE TO DELETE ── */

.swipeWrap:last-child { border-bottom: none; }
.swipeDeleteBg { position: absolute; right: 0; top: 0; bottom: 0; width: 80px; background: #c0392b; display: flex; align-items: center; justify-content: center; color: white; font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity .15s; border-radius: 0 8px 8px 0; }

/* ── ACTIVITY DETAIL SHEET ── */
.detailSheet { position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; backdrop-filter: blur(3px); }

/* ── BUDGET ── */

.expDel { background: none; border: none; color: #c06060; cursor: pointer; font-size: .85rem; padding: .2rem .3rem; }

/* ── JOURNAL ── */

.jDate { font-size: .68rem; color: var(--textLight); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

.photoAdd { aspect-ratio: 1; border-radius: 10px; border: 2px dashed var(--mist); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; color: var(--textLight); gap: .2rem; background: transparent; font-size: 1.4rem; }

/* ── SCAVENGER ── */
.huntCard { background: var(--card); border-radius: var(--radius); padding: 1.1rem; margin-bottom: .75rem; box-shadow: var(--shadow); }
.huntHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: .65rem; cursor: pointer; }

.huntCheck { width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--amber); background: transparent; flex-shrink: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .75rem; transition: all .18s; color: white; }
.huntCheck.done { background: var(--amber); border-color: var(--amber); }
.huntBody { flex: 1; }
.huntName { font-size: .88rem; font-weight: 600; }
.huntHint { font-size: .75rem; color: var(--textLight); margin-top: 2px; line-height: 1.4; }

.huntPhoto img { width: 100%; height: 100%; object-fit: cover; }
.huntPhotoEmpty { width: 48px; height: 48px; border-radius: 8px; border: 2px dashed var(--mist); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; cursor: pointer; }

.huntStatNum { font-family: 'Playfair Display',serif; font-size: 1.7rem; color: var(--amber); }
.huntStatLabel { font-size: .65rem; color: var(--textLight); text-transform: uppercase; letter-spacing: .05em; }

/* ── FORMS ── */
input, textarea, select { width: 100%; background: var(--sand); border: 1.5px solid transparent; border-radius: 10px; padding: .6rem .8rem; font-family: 'DM Sans',sans-serif; font-size: .875rem; color: var(--text); outline: none; transition: border-color .18s; margin-bottom: .55rem; }

textarea { resize: vertical; min-height: 80px; }
label { font-size: .68rem; font-weight: 600; color: var(--textLight); display: block; margin-bottom: .18rem; text-transform: uppercase; letter-spacing: .04em; }

/* ── BUTTONS ── */

.btnRow { display: flex; gap: .5rem; margin-top: .65rem; }

/* ── MODAL ── */
.overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,.48); display: flex; align-items: flex-end; backdrop-filter: blur(4px); }

.hidden { display: none !important; }
.flex { display: flex; }
.gap { gap: .5rem; }
.mt { margin-top: .65rem; }
.center { text-align: center; }
.muted { color: var(--textLight); font-size: .82rem; }
.syncStatus { font-size: .62rem; color: var(--sage); margin-top: 2px; display: flex; align-items: center; gap: .3rem; }
.syncDot { width: 6px; height: 6px; border-radius: 50%; background: var(--sage); }

/* ── HUNT REFERENCE IMAGES ── */
.huntItemInner { display: flex; align-items: flex-start; gap: .65rem; padding: .75rem 0; border-bottom: 1px solid var(--border); }
.huntItemInner:last-child { border-bottom: none; }
.huntRefImg { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex-shrink: 0; cursor: pointer; }
.huntRefImgPlaceholder { width: 64px; height: 64px; border-radius: 10px; background: var(--sand); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }

.huntProofArea { display: flex; flex-direction: column; align-items: center; gap: .2rem; flex-shrink: 0; }

.huntProofThumb img { width: 100%; height: 100%; object-fit: cover; }

.bookEntryDate { font-size: .68rem; color: var(--textLight); text-transform: uppercase; letter-spacing: .06em; }

// ══════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════
async function saveState() {
  localStorage.setItem('tripS', JSON.stringify(S));
  if (window.__supabaseReady && roadTripDb) {
    try {
      const { error } = await roadTripDb
        .from('trip_data')
        .upsert({ id: SYNC_ROW_ID, category: 'full_state', content: S },
                { onConflict: 'id' });
      if (error) throw error;
      setSyncStatus('synced');
    } catch(e) {
      console.warn('Supabase save failed:', e.message);
      setSyncStatus('local only');
    }
  }
}
async function loadState() {
  // Fetch Anthropic key from Supabase config table
  if (window.__supabaseReady && roadTripDb) {
    try {
      const { data: cfgData, error: cfgError } = await roadTripDb
        .from('config')
        .select('value')
        .eq('id', 1)
        .single();
      if (!cfgError && cfgData?.value) {
        _anthropicKey = cfgData.value;
        console.log('Anthropic key loaded OK');
      } else {
        console.warn('Config fetch error:', cfgError);
      }
    } catch(e) { console.warn('Could not load API key from config:', e.message); }
  }

  if (window.__remoteState) { S = { ...S, ...window.__remoteState }; setSyncStatus('synced'); return; }
  if (window.__supabaseReady && roadTripDb) {
    try {
      const { data, error } = await roadTripDb
        .from('trip_data')
        .select('content')
        .eq('id', SYNC_ROW_ID)
        .single();
      if (!error && data?.content) {
        S = { ...S, ...data.content };
        setSyncStatus('synced');
        return;
      }
    } catch(e) {
      console.warn('Supabase load failed, using localStorage:', e.message);
    }
  }
  const ls = localStorage.getItem('tripS');
  if (ls) { S = { ...S, ...JSON.parse(ls) }; setSyncStatus('local only'); }
}
function mergeRemoteState(r) {
  S = { ...S, ...r };
  setSyncStatus('synced');
  renderTab(_currentTab);
}
function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const color = msg === 'synced' ? '#6a9e7a' : '#c07828';
  el.innerHTML = `<div class="syncDot" style="background:${color}"></div><span>${msg}</span>`;
}

const PIN = '2829';
let _pinBuf = '';
function pin(v) {
  if (v==='clr') _pinBuf='';
  else if (v==='back') _pinBuf=_pinBuf.slice(0,-1);
  else if (_pinBuf.length<4) _pinBuf+=v;
  document.querySelectorAll('.pinDot').forEach((d,i)=>d.classList.toggle('on',i<_pinBuf.length));
  document.getElementById('pinErr').textContent='\u00a0';
  if (_pinBuf.length===4) setTimeout(()=>{
    if (_pinBuf===PIN) unlock();
    else { document.getElementById('pinErr').textContent='Incorrect PIN — try again'; _pinBuf=''; document.querySelectorAll('.pinDot').forEach(d=>d.classList.remove('on')); }
  },200);
}
async function unlock() {
  await loadState();
  document.getElementById('pinScreen').style.display='none';
  const app=document.getElementById('app');
  app.classList.add('visible');
  if (S.theme==='dark') { document.body.setAttribute('data-dark',''); document.getElementById('themeBtn').textContent='☀️'; }
  window.__appReady=true;
  goTab('home');
}
function lockApp() {
  document.getElementById('app').classList.remove('visible');
  document.getElementById('pinScreen').style.display='';
  _pinBuf=''; document.querySelectorAll('.pinDot').forEach(d=>d.classList.remove('on'));
}

function toggleTheme() {
  const dark=document.body.hasAttribute('data-dark');
  if(dark){document.body.removeAttribute('data-dark');document.getElementById('themeBtn').textContent='🌙';S.theme='light';}
  else{document.body.setAttribute('data-dark','');document.getElementById('themeBtn').textContent='☀️';S.theme='dark';}
  saveState();
}

const TABS=['home','itinerary','budget','activities','hunt','journal','book'];
function goTab(t) {
  _currentTab=t;
  TABS.forEach(x=>{ document.getElementById('t'+cap(x)).classList.add('hidden'); });
  document.getElementById('t'+cap(t)).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('on',TABS[i]===t));
  renderTab(t);
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function renderTab(t) {
  if(t==='home')renderHome();
  if(t==='itinerary')renderItinerary();
  if(t==='budget')renderBudget();
  if(t==='activities')renderActivities();
  if(t==='hunt')renderHunt();
  if(t==='journal')renderJournal();
  if(t==='book')renderBook();
}

const fmt=n=>'$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function currentStop(){const t=today();return STOPS.find(s=>t>=s.start&&t<s.end)||null;}
function totalSpent(){return S.expenses.reduce((a,e)=>a+e.amount,0);}
function catSpent(c){return S.expenses.filter(e=>e.cat===c).reduce((a,e)=>a+e.amount,0);}
function allActs(stopId){
  const hidden=(S.hiddenActs&&S.hiddenActs[stopId])||[];
  const base=(DEFAULT_ACTIVITIES[stopId]||[]).filter(a=>!hidden.includes(a.id));
  const custom=S.customActs[stopId]||[];
  return [...base,...custom];
}

function bindSwipeDelete(){
  document.querySelectorAll('.swipeWrap').forEach(wrap=>{
    const row=wrap.querySelector('.swipeRow');
    const bg=wrap.querySelector('.swipeDeleteBg');
    if(!row||row._sb)return;
    row._sb=true;
    const PEEK=80;
    const THRESH=120;
    let sx=0,sy=0,cx=0,drag=false,open=false;

    bg.style.pointerEvents='auto';
    bg.style.cursor='pointer';

    // Tap red bg — always delete, no confirm()
    bg.addEventListener('click',e=>{
      e.stopPropagation();
      animateAndDelete(wrap);
    });

    // Tap row body when open = snap shut
    row.addEventListener('click',e=>{
      if(open){ e.stopPropagation(); snapShut(); }
    });

    function snapShut(){
      open=false;
      row.style.transition='transform .2s ease';
      row.style.transform='translateX(0)';
      bg.classList.remove('vis');
    }

    row.addEventListener('touchstart',e=>{
      if(open){ snapShut(); return; }
      sx=e.touches[0].clientX; sy=e.touches[0].clientY;
      cx=0; drag=true; row.style.transition='none';
    },{passive:true});

    row.addEventListener('touchmove',e=>{
      if(!drag)return;
      const dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
      if(Math.abs(dy)>Math.abs(dx)+10){drag=false;return;}
      if(dx>0)return;
      cx=dx;
      row.style.transform='translateX('+Math.max(dx,-THRESH-20)+'px)';
      bg.classList.toggle('vis',Math.abs(dx)>30);
    },{passive:true});

    row.addEventListener('touchend',()=>{
      if(!drag)return; drag=false;
      if(Math.abs(cx)>=THRESH){
        // Full hard swipe — delete immediately
        animateAndDelete(wrap);
      } else if(Math.abs(cx)>=PEEK*0.5){
        // Partial swipe — park open, tap red button to confirm
        row.style.transition='transform .15s ease';
        row.style.transform='translateX(-'+PEEK+'px)';
        bg.classList.add('vis');
        open=true;
      } else {
        snapShut();
      }
    });
  });
}

function animateAndDelete(wrap){
  const row=wrap.querySelector('.swipeRow');
  row.style.transition='transform .2s ease';
  row.style.transform='translateX(-110%)';
  setTimeout(()=>{
    wrap.style.transition='max-height .22s ease, opacity .22s ease';
    wrap.style.maxHeight=wrap.offsetHeight+'px';
    wrap.style.overflow='hidden';
    requestAnimationFrame(()=>{ wrap.style.maxHeight='0'; wrap.style.opacity='0'; });
    setTimeout(()=>delActSilent(wrap.dataset.stop, wrap.dataset.act), 240);
  },200);
}

function delActSilent(stopId,actId){
  // Custom activity: remove from customActs
  if((S.customActs[stopId]||[]).find(a=>a.id===actId)){
    S.customActs[stopId]=S.customActs[stopId].filter(a=>a.id!==actId);
  } else {
    // Built-in: track as hidden
    if(!S.hiddenActs)S.hiddenActs={};
    if(!S.hiddenActs[stopId])S.hiddenActs[stopId]=[];
    if(!S.hiddenActs[stopId].includes(actId))S.hiddenActs[stopId].push(actId);
  }
  saveState(); renderActivities();
}

  const name=el.nextElementSibling?.querySelector('.actName');
  if(name)name.classList.toggle('done',S.activities[stopId][actId]);

async function aiLookupActivity(){
  const name=$('actName').value.trim();
  const stopId=$('actStop').value;
  const stop=STOPS.find(s=>s.id===stopId);
  if(!name)return alert('Enter a hike or activity name first');
  $('actAiStatus').textContent='🔍 Looking up details...';
  try{
    const prompt=`You are a national park expert. Give details about this activity for a family of 4 (parents + boys aged 10 and 12) visiting ${stop.name} (${stop.park}).

Activity: "${name}"

Respond ONLY with a JSON object, no markdown, no explanation. Format:
{
  "name": "corrected full name",
  "tag": "hike|must|view|water|food",
  "dist": "X miles round trip or one-way",
  "dur": "X-X hours",
  "diff": "Easy|Moderate|Hard|Very Hard",
  "desc": "2-3 sentence description of what makes it worth doing",
  "tip": "1 practical insider tip for families",
  "maps": "best Google Maps search string to find this exact location"
}`;
    if(!_anthropicKey)throw new Error('API key not loaded');
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','x-api-key':_anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,messages:[{role:'user',content:prompt}]})
    });
    const d=await res.json();
    const text=d.content?.find(c=>c.type==='text')?.text||'';
    const clean=text.replace(/```json|```/g,'').trim();
    const info=JSON.parse(clean);
    $('actName').value=info.name||name;
    $('actTag').value=info.tag||'hike';
    $('actDist').value=info.dist||'';
    $('actDur').value=info.dur||'';
    $('actDiff').value=info.diff||'';
    $('actDesc').value=info.desc||'';
    $('actTip').value=info.tip||'';
    $('actMaps').value=info.maps||'';
    $('actAiStatus').textContent='✅ Details filled in — review and save!';
    $('actAiStatus').style.color='var(--moss)';
  }catch(e){
    $('actAiStatus').textContent='Could not fetch details — fill in manually.';
    $('actAiStatus').style.color='var(--amber)';
  }
}

function saveActivity(){
  const stopId=$('actStop').value;
  const name=$('actName').value.trim();
  if(!name)return alert('Enter an activity name');
  const act={id:'c'+Date.now(),name,tag:$('actTag').value,dist:$('actDist').value,dur:$('actDur').value,diff:$('actDiff').value,desc:$('actDesc').value,tip:$('actTip').value,maps:$('actMaps').value};
  if(!S.customActs[stopId])S.customActs[stopId]=[];
  const editId=$('actEditId').value;
  if(editId){S.customActs[stopId]=S.customActs[stopId].map(a=>a.id===editId?{...act,id:editId}:a);}
  else{S.customActs[stopId].push(act);}
  saveState();
  hide('actModal');
  renderActivities();
  // If opened from the itinerary stop sheet, reopen it so user lands back in context
  if(_addActFromStop && _currentTab==='itinerary'){
    setTimeout(()=>showStopSheet(_addActFromStop), 100);
  }
}

function delAct(stopId,actId){
  if(!confirm('Remove this activity?'))return;
  S.customActs[stopId]=(S.customActs[stopId]||[]).filter(a=>a.id!==actId);
  saveState();renderActivities();
}

      <div style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--amber);margin-bottom:.25rem">&#127381; Fun Fact</div>

    <div style="display:flex;gap:.65rem">

      <button onclick="huntPhotoAdd('${item.id}');this.closest('[style*=fixed]').remove()" style="background:var(--forest);color:white;border:none;border-radius:12px;padding:.7rem 1rem;font-family:'DM Sans',sans-serif;font-size:.875rem;cursor:pointer">📷 ${h.photo?'Replace':'Add'} Photo</button>

function toggleHunt(id){
  if(!S.hunt[id])S.hunt[id]={done:false,photo:null};
  S.hunt[id].done=!S.hunt[id].done;
  saveState();
  renderHunt();
}

async function uploadToStorage(file, folder) {
  // Resize image to max 1200px before upload
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.createElement('canvas');
        const MAX = 1200;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(async blob => {
          if (!window.__supabaseReady || !roadTripDb) {
            // fallback: return base64 data URL
            resolve(canvas.toDataURL('image/jpeg', 0.82));
            return;
          }
          const filename = `${folder}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;
          const { data, error } = await roadTripDb.storage
            .from(STORAGE_BUCKET)
            .upload(filename, blob, { contentType: 'image/jpeg', upsert: false });
          if (error) {
            console.warn('Storage upload failed, using base64:', error.message);
            resolve(canvas.toDataURL('image/jpeg', 0.82));
            return;
          }
          const { data: urlData } = roadTripDb.storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(filename);
          resolve(urlData.publicUrl);
        }, 'image/jpeg', 0.82);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function huntPhotoAdd(id){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.capture='environment';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    // Show uploading state
    if(!S.hunt[id])S.hunt[id]={done:true,photo:null};
    S.hunt[id]._uploading=true;
    renderHunt();
    const url = await uploadToStorage(f, 'hunt');
    S.hunt[id].photo = url;
    S.hunt[id].done = true;
    delete S.hunt[id]._uploading;
    saveState();renderHunt();
  };
  inp.click();
}

function viewHuntPhoto(id){
  const h=S.hunt[id];if(!h?.photo)return;
  const item=SCAVENGER_HUNT.flatMap(c=>c.items).find(i=>i.id===id);
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;padding:1rem';
  overlay.innerHTML=`
    <div style="color:white;font-family:'Playfair Display',serif;font-size:1.1rem">${item?.name||'Photo'}</div>
    <img src="${h.photo}" style="max-width:100%;max-height:70vh;border-radius:12px;object-fit:contain">
    <button style="background:rgba(255,255,255,.15);border:none;color:white;padding:.6rem 1.5rem;border-radius:10px;font-size:.9rem;cursor:pointer" onclick="this.parentElement.remove()">Close</button>
  `;
  overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove();});
  document.body.appendChild(overlay);
}

function huntDelPhoto(e,id){
  e.stopPropagation();
  if(S.hunt[id])S.hunt[id].photo=null;
  saveState();renderHunt();
}

// ══════════════════════════════════════════
// JOURNAL
// ══════════════════════════════════════════
function renderJournal(){
  const entries=[...(S.journal||[])].reverse();
  const btn='<button class="btn btnAmber" style="margin-bottom:.85rem" onclick="openJournal()">+ New Journal Entry</button>';
  if(!entries.length){$('tJournal').innerHTML=btn+`<div class="muted center" style="padding:2rem"><div style="font-size:2rem;margin-bottom:.5rem">📖</div>Start capturing your adventure!</div>`;return;}
  const html=entries.map(e=>{
    const stop=STOPS.find(s=>s.id===e.stopId);
    const photos=(S.photos[e.id]||[]).map(p=>`<div class="photoThumb"><img src="${p}" alt=""></div>`).join('');
    return `<div class="jEntry">
      <div class="jDate">${fmtDate(e.date)}</div>
      <div class="jLoc">${stop?stop.emoji+' '+stop.name:''}</div>
      <div class="jText">${(e.polished||e.raw).replace(/\n\n/g,'<br><br>')}</div>
      ${(e.kid1||e.kid2)?`<div class="jKids">
        ${e.kid1?`<div class="kidLabel">Kid 1</div><div class="kidNote">"${e.kid1}"</div>`:''}
        ${e.kid2?`<div class="kidLabel" style="margin-top:.4rem">Kid 2</div><div class="kidNote">"${e.kid2}"</div>`:''}
      </div>`:''}
      ${photos?`<div class="photoGrid">${photos}</div>`:''}
    </div>`;
  }).join('');
  $('tJournal').innerHTML=btn+html;
}
function openJournal(){
  $('jStop').innerHTML=STOPS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  const cur=currentStop();if(cur)$('jStop').value=cur.id;
  $('jText').value='';$('jKid1').value='';$('jKid2').value='';
  $('jAiArea').innerHTML='';_jPhotos=[];_polished=null;
  renderJPhotoGrid();show('jModal');
}
function renderJPhotoGrid(){
  let html=_jPhotos.map((p,i)=> p==='__uploading__'
    ? `<div class="photoThumb" style="display:flex;align-items:center;justify-content:center;background:var(--sand);font-size:.7rem;color:var(--textLight)">⏳</div>`
    : `<div class="photoThumb"><img src="${p}" alt=""><button class="photoDel" onclick="rmJPhoto(${i})">✕</button></div>`
  ).join('');
  if(_jPhotos.length<4)html+=`<div class="photoAdd" onclick="$('jPhotoFile').click()"><span>+</span><span>Photo</span></div>`;
  $('jPhotoGrid').innerHTML=html;
}
function rmJPhoto(i){_jPhotos.splice(i,1);renderJPhotoGrid();}
function handlePhoto(e){
  const files = Array.from(e.target.files).slice(0, 4 - _jPhotos.length);
  e.target.value = '';
  files.forEach(async f => {
    // Push a placeholder so the grid shows a spinner immediately
    const placeholderIdx = _jPhotos.length;
    _jPhotos.push('__uploading__');
    renderJPhotoGrid();
    const url = await uploadToStorage(f, 'journal');
    _jPhotos[placeholderIdx] = url;
    renderJPhotoGrid();
  });
}
async function polishJournal(){
  const text=$('jText').value.trim();if(!text)return alert('Add some notes first!');
  const stop=STOPS.find(s=>s.id===$('jStop').value);
  const kid1=$('jKid1').value,kid2=$('jKid2').value;
  $('jAiArea').innerHTML='<div class="muted center" style="padding:.75rem">✨ Polishing your memories...</div>';
  try{
    const prompt=`You are helping a family write a beautiful travel journal entry.
Parent's rough notes: "${text}"
${kid1?`Kid 1's highlight: "${kid1}"`:''}
${kid2?`Kid 2's highlight: "${kid2}"`:''}
Location: ${stop.name} (${stop.park})

Write a warm, vivid, 2-3 paragraph journal entry in first-person plural (we/our — the parents writing together). Keep it personal, specific, heartfelt. Capture emotions, sights, and family moments. 3-4 sentences per paragraph. Avoid clichés like "magical" or "breathtaking". Make it feel like a real family memory. Do not add headers or labels.`;
    if(!_anthropicKey)throw new Error('API key not loaded');
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json','x-api-key':_anthropicKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const d=await res.json();
    _polished=d.content?.find(c=>c.type==='text')?.text||'';
    $('jAiArea').innerHTML=`<div class="aiResult">${_polished.replace(/\n\n/g,'<br><br>')}</div>`;
  }catch(e){$('jAiArea').innerHTML='<div class="muted">Could not reach AI — you can save raw notes.</div>';}
}
function saveJournal(){
  const raw=$('jText').value.trim();if(!raw)return alert('Add some notes first!');
  const id=Date.now();
  S.journal.push({id,date:today(),stopId:$('jStop').value,raw,polished:_polished||null,kid1:$('jKid1').value,kid2:$('jKid2').value});
  if(_jPhotos.length)S.photos[id]=[..._jPhotos];
  _jPhotos=[];_polished=null;
  saveState();hide('jModal');renderJournal();
}

// PHOTO BOOK
// ══════════════════════════════════════════
function renderBook(){
  const hasContent=S.journal.length>0||Object.values(S.hunt).some(h=>h.photo);

  if(!hasContent){
    $('tBook').innerHTML=`
      <div class="bookEmpty">
        <div style="font-size:3rem;margin-bottom:.75rem">📖</div>
        <div style="font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:.5rem">Your Book is Empty</div>
        <div class="muted">Add journal entries and scavenger hunt photos during the trip — they'll all appear here automatically as a printable memory book.</div>
      </div>`;
    return;
  }

  let html=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem" class="noPrint">
      <div>
        <div style="font-family:'Playfair Display',serif;font-size:1.15rem">Memory Book</div>
        <div class="muted" style="font-size:.72rem">Struss Family Road Trip 2026</div>
      </div>
      <button class="btn btnAmber btnSm" onclick="printBook()">🖨️ Print / Save PDF</button>
    </div>

    <!-- COVER -->
    <div class="bookChapter" style="text-align:center;padding:2rem 1rem;background:linear-gradient(135deg,var(--forest),var(--moss));border-radius:var(--radius);color:white;margin-bottom:1.5rem">
      <div style="font-size:3rem;margin-bottom:.5rem">🏔️</div>
      <div style="font-family:'Playfair Display',serif;font-size:1.8rem;line-height:1.2">Struss Family<br>Road Trip</div>
      <div style="opacity:.8;margin-top:.5rem;font-size:.9rem">June 27 – July 27, 2026</div>
      <div style="opacity:.65;margin-top:.25rem;font-size:.75rem">Grand Teton · Yellowstone · Glacier · Yoho · Banff · Jasper</div>
      <div style="margin-top:1.25rem;display:flex;justify-content:center;gap:2rem">
        <div><div style="font-size:1.4rem;font-weight:700">${S.journal.length}</div><div style="font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.05em">Days Journaled</div></div>
        <div><div style="font-size:1.4rem;font-weight:700">${Object.values(S.hunt).filter(h=>h.done).length}</div><div style="font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.05em">Hunt Items Found</div></div>
        <div><div style="font-size:1.4rem;font-weight:700">${Object.values(S.photos).flat().length+Object.values(S.hunt).filter(h=>h.photo).length}</div><div style="font-size:.65rem;opacity:.7;text-transform:uppercase;letter-spacing:.05em">Photos</div></div>
      </div>
    </div>`;

  // Chapter per stop
  STOPS.forEach(stop=>{
    const entries=S.journal.filter(e=>e.stopId===stop.id);
    const huntItems=SCAVENGER_HUNT.flatMap(c=>c.items).filter(i=>S.hunt[i.id]?.photo);
    const stopHuntItems=huntItems.filter(i=>i.parks.includes(stop.park.replace(' NP','').replace(' National Park',''))||i.parks.includes('All'));

    if(!entries.length&&!stopHuntItems.length)return;

    html+=`<div class="bookChapter card">
      <div class="bookChapterTitle">${stop.emoji} ${stop.name} <span style="font-size:.75rem;font-weight:400;color:var(--textLight)">${stop.park} · ${stop.dates}</span></div>`;

    // Journal entries for this stop
    entries.forEach(e=>{
      const photos=S.photos[e.id]||[];
      html+=`<div class="bookEntry">
        <div class="bookEntryDate">${fmtDate(e.date)}</div>
        <div class="bookEntryText">${(e.polished||e.raw).replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}</div>
        ${e.kid1?`<div class="bookKidQuote">Kid 1: "${e.kid1}"</div>`:''}
        ${e.kid2?`<div class="bookKidQuote">Kid 2: "${e.kid2}"</div>`:''}
        ${photos.length?`<div class="bookPhotoRow">${photos.map(p=>`<img src="${p}" alt="">`).join('')}</div>`:''}
      </div>`;
    });

    // Scavenger hunt photos for this stop
    const proofPhotos=SCAVENGER_HUNT.flatMap(c=>c.items)
      .filter(i=>S.hunt[i.id]?.photo)
      .filter(i=>i.parks.some(p=>p==='All'||stop.park.includes(p)||p.includes(stop.park.split(' ')[0])));

    if(proofPhotos.length){
      html+=`<div class="bookHuntSection">
        <div class="sectionLabel" style="margin-top:.75rem">🔍 What we found here</div>
        <div class="bookHuntGrid">
          ${proofPhotos.map(i=>`
            <div class="bookHuntItem">
              <img src="${S.hunt[i.id].photo}" alt="${i.name}">
              <div class="bookHuntLabel">${i.name}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }

    html+=`</div>`;
  });

  // Full scavenger gallery at the end
  const allProof=SCAVENGER_HUNT.flatMap(c=>c.items).filter(i=>S.hunt[i.id]?.photo);
  if(allProof.length){
    html+=`<div class="bookChapter card">
      <div class="bookChapterTitle">🔍 Complete Scavenger Hunt Gallery</div>
      <div class="muted" style="margin-bottom:.75rem;font-size:.8rem">Everything the boys found on the trip</div>
      <div class="bookHuntGrid" style="grid-template-columns:repeat(3,1fr)">
        ${allProof.map(i=>`
          <div class="bookHuntItem">
            <img src="${S.hunt[i.id].photo}" alt="${i.name}">
            <div class="bookHuntLabel">${i.name}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // Closing page
  html+=`<div class="bookChapter" style="text-align:center;padding:2rem 1rem;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)">
    <div style="font-size:2rem;margin-bottom:.5rem">🏕️</div>
    <div style="font-family:'Playfair Display',serif;font-size:1.15rem">The End of an Epic Adventure</div>
    <div class="muted" style="margin-top:.4rem;font-size:.8rem">Struss Family · Summer 2026</div>
  </div>`;

  $('tBook').innerHTML=html;
}

function printBook(){
  // Hide everything except book tab, print, restore
  const tabs=document.querySelectorAll('[id^="t"]:not(#tBook)');
  const header=document.querySelector('header');
  tabs.forEach(t=>t.setAttribute('data-wasHidden',t.classList.contains('hidden')?'1':'0'));
  tabs.forEach(t=>t.classList.add('hidden'));
  header.style.display='none';
  window.print();
  setTimeout(()=>{
    tabs.forEach(t=>{if(t.getAttribute('data-wasHidden')==='0')t.classList.remove('hidden');});
    header.style.display='';
  },1000);
}
window.addEventListener('DOMContentLoaded',()=>{
  // Pre-fill stop selects
  const opts=STOPS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  ['eStop','actStop','jStop'].forEach(id=>{ const el=$(id); if(el)el.innerHTML=opts; });
});
