<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Struss Road Trip 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ── CONFIGURATION ────────────────────────────────────────────────────────
  const supabaseUrl = 'https://ppnsknbcavcaswelhfac.supabase.co';
  const supabaseKey = 'sb_publishable_GMRYvSKaYhpNFoDhS4YANw_t3vE27Qe';
  
  // FIXED: Renamed to 'roadTripDb' to ensure it NEVER clashes with the library
  let roadTripDb;
  
  // We wrap this in a function to ensure the library is loaded first
  window.onload = () => {
    try {
      roadTripDb = supabase.createClient(supabaseUrl, supabaseKey);
      console.log("Supabase connection initialized!");
    } catch (e) {
      console.error("Initialization failed:", e);
    }
  };

  // ── DATABASE SYNC ────────────────────────────────────────────────────────
  async function saveState() {
    localStorage.setItem('tripS', JSON.stringify(S));
    if (!roadTripDb) return;

    const { error } = await roadTripDb
      .from('trip_data')
      .upsert({ id: 1, category: 'full_state', content: S });

    if (error) setSyncStatus('error');
    else setSyncStatus('synced');
  }

  async function loadState() {
    if (!roadTripDb) {
        console.log("Database not ready yet, retrying...");
        return;
    }

    const { data, error } = await roadTripDb
      .from('trip_data')
      .select('content')
      .eq('id', 1)
      .single();

    if (data && data.content) {
      S = { ...S, ...data.content };
      setSyncStatus('synced');
    }
  }
</script>

<style>
:root { --pine: #0f1f0f; --mist: #b0ceba; --sage: #6a9e7a; --cream: #f4efe6; --amber: #c07828; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); margin: 0; }
#pinScreen { position: fixed; inset: 0; z-index: 999; background: var(--pine); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; color: white; }
.pinDots { display: flex; gap: 1rem; }
.pinDot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--sage); }
.pinDot.on { background: var(--amber); border-color: var(--amber); }
.pinPad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.pinKey { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--sage); padding: 1.5rem; border-radius: 10px; font-size: 1.5rem; cursor: pointer; }
#app { display: none; padding: 2rem; }
#app.visible { display: block; }
</style>
</head>
<body>

<div id="pinScreen">
  <h1>Struss Road Trip</h1>
  <div class="pinDots" id="pinDots">
    <div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div>
  </div>
  <div class="pinPad">
    <button class="pinKey" onclick="pin('1')">1</button><button class="pinKey" onclick="pin('2')">2</button><button class="pinKey" onclick="pin('3')">3</button>
    <button class="pinKey" onclick="pin('4')">4</button><button class="pinKey" onclick="pin('5')">5</button><button class="pinKey" onclick="pin('6')">6</button>
    <button class="pinKey" onclick="pin('7')">7</button><button class="pinKey" onclick="pin('8')">8</button><button class="pinKey" onclick="pin('9')">9</button>
    <button class="pinKey" onclick="pin('0')">0</button>
  </div>
</div>

<div id="app">
  <h1>App Unlocked!</h1>
  <div id="syncStatus"><span>Status: Connecting...</span></div>
</div>

<script>
let S = { expenses: [], journal: [] };
const PIN = '2829';
let _pinBuf = '';

function pin(v) {
  if (_pinBuf.length < 4) _pinBuf += v;
  document.querySelectorAll('.pinDot').forEach((d, i) => d.classList.toggle('on', i < _pinBuf.length));
  if (_pinBuf.length === 4) {
    if (_pinBuf === PIN) unlock();
    else {
        _pinBuf = '';
        document.querySelectorAll('.pinDot').forEach(d => d.classList.remove('on'));
    }
  }
}

async function unlock() {
  await loadState();
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
}

function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.querySelector('span').textContent = 'Status: ' + msg;
}
</script>
</body>
</html>
