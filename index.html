<script>
  // ── CONFIGURATION ────────────────────────────────────────────────────────
  const supabaseUrl = 'https://ppnsknbcavcaswelhfac.supabase.co';
  const supabaseKey = 'sb_publishable_GMRYvSKaYhpNFoDhS4YANw_t3vE27Qe';
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  // ── DATABASE SYNC ────────────────────────────────────────────────────────
  async function saveState() {
    localStorage.setItem('tripS', JSON.stringify(S));
    const { error } = await supabase
      .from('trip_data')
      .upsert({ id: 1, category: 'full_state', content: S });

    if (error) {
      console.error('Cloud Sync Error:', error.message);
      setSyncStatus('error');
    } else {
      setSyncStatus('synced');
    }
  }

  async function loadState() {
    const { data, error } = await supabase
      .from('trip_data')
      .select('content')
      .eq('id', 1)
      .single();

    if (data && data.content) {
      S = { ...S, ...data.content };
      setSyncStatus('synced');
      renderTab(_currentTab);
    } else if (localStorage.getItem('tripS')) {
      S = JSON.parse(localStorage.getItem('tripS'));
      setSyncStatus('local only');
    }
  }

  // ── PHOTO STORAGE ────────────────────────────────────────────────────────
  async function uploadPhotoToSupabase(fileData, fileName) {
    const base64Data = fileData.split(',')[1];
    const byteCharacters = atob(base64Data);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: 'image/jpeg'});

    const filePath = `public/${Date.now()}-${fileName}.jpg`;

    const { data, error } = await supabase.storage
      .from('trip-photos')
      .upload(filePath, blob);

    if (error) {
      console.error('Upload Error:', error.message);
      return null;
    }

    const { data: urlData } = supabase.storage.from('trip-photos').getPublicUrl(filePath);
    return urlData.publicUrl;
  }
</script>

let _currentTab = 'home';

const PIN = '2829';
let _pinBuf = '';
function pin(v) {
  if (v==='clr') _pinBuf='';
  else if (v==='back') _pinBuf=_pinBuf.slice(0,-1);
  else if (_pinBuf.length<4) _pinBuf+=v;
  document.querySelectorAll('.pinDot').forEach((d,i)=>d.classList.toggle('on',i<_pinBuf.length));
  if (_pinBuf.length===4) setTimeout(()=>{ if (_pinBuf===PIN) unlock(); else _pinBuf=''; },200);
}

async function unlock() {
  await loadState();
  document.getElementById('pinScreen').style.display='none';
  document.getElementById('app').classList.add('visible');
  goTab('home');
}

function goTab(t) {
    _currentTab = t;
    ['home','itinerary','budget','activities','hunt','journal','book'].forEach(x => {
        const el = document.getElementById('t' + x.charAt(0).toUpperCase() + x.slice(1));
        if (el) el.classList.toggle('hidden', x !== t);
    });
}

function setSyncStatus(msg) {
    const el = document.getElementById('syncStatus');
    if (el) el.querySelector('span').textContent = msg;
}
