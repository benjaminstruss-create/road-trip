<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Struss Road Trip 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // ── CONFIGURATION ────────────────────────────────────────────────────────
  const supabaseUrl = 'https://ppnsknbcavcaswelhfac.supabase.co';
  const supabaseKey = 'sb_publishable_GMRYvSKaYhpNFoDhS4YANw_t3vE27Qe';
  
  // FIXED: Renamed to tripDb to stop the "already declared" error
  let tripDb;
  try {
    tripDb = supabase.createClient(supabaseUrl, supabaseKey);
  } catch (e) {
    console.error("Connection failed:", e);
  }

  // ── DATABASE SYNC ────────────────────────────────────────────────────────
  async function saveState() {
    localStorage.setItem('tripS', JSON.stringify(S));
    if (!tripDb) return;

    const { error } = await tripDb
      .from('trip_data')
      .upsert({ id: 1, category: 'full_state', content: S });

    if (error) setSyncStatus('error');
    else setSyncStatus('synced');
  }

  async function loadState() {
    if (!tripDb) return;

    const { data, error } = await tripDb
      .from('trip_data')
      .select('content')
      .eq('id', 1)
      .single();

    if (data && data.content) {
      S = { ...S, ...data.content };
      setSyncStatus('synced');
      if (typeof renderTab === 'function') renderTab(_currentTab);
    } else if (localStorage.getItem('tripS')) {
      S = JSON.parse(localStorage.getItem('tripS'));
      setSyncStatus('local only');
    }
  }

  // ── PHOTO STORAGE ────────────────────────────────────────────────────────
  async function uploadPhotoToSupabase(fileData, fileName) {
    if (!tripDb) return null;
    const base64Data = fileData.split(',')[1];
    const byteCharacters = atob(base64Data);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], {type: 'image/jpeg'});

    const filePath = `public/${Date.now()}-${fileName}.jpg`;

    const { data, error } = await tripDb.storage
      .from('trip-photos')
      .upload(filePath, blob);

    if (error) return null;

    const { data: urlData } = tripDb.storage.from('trip-photos').getPublicUrl(filePath);
    return urlData.publicUrl;
  }
</script>

<style>
:root {
  --pine: #0f1f0f; --mist: #b0ceba; --sage: #6a9e7a; --cream: #f4efe6; --amber: #c07828;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--cream); overflow-x: hidden; }
#pinScreen { position: fixed; inset: 0; z-index: 999; background: var(--pine); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; }
.pinTitle { font-family: 'Playfair Display', serif; color: var(--mist); font-size: 1.8rem; text-align: center; }
.pinDots { display: flex; gap: 1rem; }
.pinDot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--sage); }
.pinDot.on { background: var(--amber); border-color: var(--amber); }
.pinPad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.pinKey { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--sage); padding: 1.2rem; border-radius: 10px; font-size: 1.5rem; }
#app { display: none; }
#app.visible { display: flex; flex-direction: column; height: 100vh; }
header { background: var(--pine); color: white; padding: 1rem; }
.syncStatus { font-size: 0.7rem; color: var(--sage); }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="pinScreen">
  <div class="pinTitle">Struss Road Trip 2026</div>
  <div class="pinDots" id="pinDots">
    <div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div><div class="pinDot"></div>
  </div>
  <div class="pinPad">
    <button class="pinKey" onclick="pin('1')">1</button><button class="pinKey" onclick="pin('2')">2</button><button class="pinKey" onclick="pin('3')">3</button>
    <button class="pinKey" onclick="pin('4')">4</button><button class="pinKey" onclick="pin('5')">5</button><button class="pinKey" onclick="pin('6')">6</button>
    <button class="pinKey" onclick="pin('7')">7</button><button class="pinKey" onclick="pin('8')">8</button><button class="pinKey" onclick="pin('9')">9</button>
    <button class="pinKey" onclick="pin('0')">0</button>
  </div>
</div>

<div id="app">
  <header>
    <h1>Road Trip App</h1>
    <div class="syncStatus" id="syncStatus"><span>connecting...</span></div>
  </header>
  <main style="padding: 2rem;">
    <h2>App Unlocked!</h2>
    <p>Everything is now syncing with Supabase.</p>
  </main>
</div>

<script>
let S = { expenses: [], journal: [] };
const PIN = '2829';
let _pinBuf = '';

function pin(v) {
  if (_pinBuf.length < 4) _pinBuf += v;
  document.querySelectorAll('.pinDot').forEach((d, i) => d.classList.toggle('on', i < _pinBuf.length));
  if (_pinBuf.length === 4) {
    if (_pinBuf === PIN) unlock();
    else _pinBuf = '';
  }
}

async function unlock() {
  await loadState();
  document.getElementById('pinScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
}

function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.querySelector('span').textContent = msg;
}
</script>
</body>
</html>
